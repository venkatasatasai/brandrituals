<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Brand Rituals Marketing</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#161412;--night:#0B0B0B;--card:#2A2523;--sand:#CDB9A3;--signal:#FF5A36;
--font-sans:'Hanken Grotesk',system-ui,sans-serif;--font-serif:'Instrument Serif',Georgia,serif;--gutter:clamp(16px,5vw,64px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:#F5F2EE;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:22px var(--gutter)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--signal)}
.glow{position:absolute;inset:0;background:radial-gradient(520px circle at 50% 48%,rgba(255,90,54,.18),transparent 70%)}
.ring{position:absolute;left:50%;top:50%;width:min(900px,150vw);aspect-ratio:1;translate:-50% -50%;border:1px dashed rgba(255,255,255,.12);border-radius:50%;animation:spin 80s linear infinite}
.ring.two{width:min(620px,105vw);animation-duration:55s;animation-direction:reverse}
.ring b{position:absolute;top:0;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--signal);box-shadow:0 0 24px 4px rgba(255,90,54,.6)}
.ring.two b{background:var(--sand);box-shadow:0 0 18px 2px rgba(205,185,163,.5);width:10px;height:10px;margin:-5px 0 0 -5px}
@keyframes spin{to{transform:rotate(360deg)}}
main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter) 40px}
.num{font-family:var(--font-serif);font-size:clamp(130px,26vw,300px);line-height:.85;letter-spacing:-.03em;margin:0;
  background:linear-gradient(180deg,#F5F2EE 30%,rgba(245,242,238,.25));-webkit-background-clip:text;background-clip:text;color:transparent;animation:float 7s ease-in-out infinite}
.num em{color:var(--signal);-webkit-text-fill-color:var(--signal)}
@keyframes float{50%{transform:translateY(-12px)}}
h1{font-family:var(--font-serif);font-weight:400;font-size:clamp(30px,4.6vw,52px);margin:18px 0 10px;letter-spacing:-.01em}
h1 i{color:var(--sand)}
p{max-width:430px;margin:0 0 30px;font-size:17px;line-height:1.6;color:#C9C2BB}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{padding:15px 32px;border-radius:999px;font-size:15px;font-weight:500;transition:transform .25s,box-shadow .25s}
.btn.p{background:var(--signal);color:#fff;box-shadow:0 16px 34px -14px rgba(255,90,54,.85)}
.btn.s{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2)}
.btn:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.ring,.num{animation:none}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="ring"><b></b></div><div class="ring two"><b></b></div>
<header class="top"><a class="brand" href="/"><i></i>Brand Rituals Marketing</a></header>
<main>
  <div class="num">4<em>0</em>4</div>
  <h1>This page <i>wandered off.</i></h1>
  <p>The link may be broken or the page may have moved. Let's get you back to something good.</p>
  <div class="btns">
    <a class="btn p" href="/">Back to home</a>
    <a class="btn s" href="/#work">See our work</a>
    <a class="btn s" href="/#contact">Get in touch</a>
  </div>
</main>
</body>
</html>
